name: Update music catalog
on:
  push:
    branches: [main]
    paths:
      - 'music/**'
      - 'scripts/publish.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: music-catalog
  cancel-in-progress: true
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out music
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install metadata reader
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Update catalog
        run: python3 scripts/publish.py --write
      - name: Commit updated catalog
        run: |
          if ! git diff --quiet -- catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add catalog.json
            git commit -m 'Automatically update music catalog'
            git push
          fi
